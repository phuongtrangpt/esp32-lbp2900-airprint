name: Build HP P1006 and Canon LBP2900 ESP 32
on:
  push:
    branches-ignore: [web/access-codes]
    paths-ignore:
      - .gitignore
      - .github/workflows/key-access.yml
      - installer/**
      - tools/prepare_capt_family_web.py
      - .github/workflows/capt-web.yml
      - .github/workflows/cloudflare-pages.yml
      - .github/workflows/build.yml
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    env:
      FIRMWARE_UPDATE_BASE_URL: ${{ vars.FIRMWARE_UPDATE_BASE_URL }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
      - name: Install build tools
        run: python -m pip install platformio==6.2.0 esptool==4.9.0
      - name: Build dedicated HP P1006 firmware
        run: |
          pio run -e hp
          python tools/package_firmware.py --env hp --out firmware/hp
          python tools/prepare_web_installer.py --source firmware/hp --dest installer/public/firmware/hp
      - name: Build experimental HP P1008 firmware
        run: |
          pio run -e hp_p1008
          python tools/package_firmware.py --env hp_p1008 --out firmware/hp_p1008
          python tools/prepare_web_installer.py --source firmware/hp_p1008 --dest installer/public/firmware/hp_p1008
      - name: Build dedicated Canon LBP2900 firmware
        run: |
          pio run -e canon
          python tools/package_firmware.py --env canon --out firmware/canon
          python tools/prepare_web_installer.py --source firmware/canon --dest installer/public/firmware/canon
      - name: Build Canon PIXMA USB firmware
        run: |
          pio run -e pixma
          python tools/package_firmware.py --env pixma --out firmware/pixma
          python tools/prepare_web_installer.py --source firmware/pixma --dest installer/public/firmware/pixma
      - name: Build standard PCL5 and PostScript USB firmware
        run: |
          pio run -e standard
          python tools/package_firmware.py --env standard --out firmware/standard
          python tools/prepare_web_installer.py --source firmware/standard --dest installer/public/firmware/standard
      - name: Build host tests
        run: make -C host all hp_p1008_host
      - name: Static IP and automatic HP bootstrap tests
        run: |
          ASAN_OPTIONS=detect_leaks=0 host/portal_dns_host
          node tools/test_device_pages.mjs
          python tools/test_wifi_signal.py
          ASAN_OPTIONS=detect_leaks=0 host/network_config_host
          curl -fsSL https://www.quirinux.org/printers/sihpP1006.tar.gz -o /tmp/hp-source.tar.gz
          ASAN_OPTIONS=detect_leaks=0 host/hp_bootstrap_host /tmp/hp-source.tar.gz /tmp/hp-verified.dl
          python -c "import tarfile; t=tarfile.open('/tmp/hp-source.tar.gz'); open('/tmp/hp-source.img','wb').write(t.extractfile('sihpP1006.img').read())"
          HP_SOURCE_IMAGE=/tmp/hp-source.img go test tools/offline/main.go tools/offline/main_test.go
          python tools/test_profiles.py
      - name: Byte-exact optimized monochrome raster
        run: ASAN_OPTIONS=detect_leaks=0 host/mono_host
      - name: CAPT raster and error tests
        run: ASAN_OPTIONS=detect_leaks=0 host/capt_host
      - name: On-board recovery LED pattern
        run: ASAN_OPTIONS=detect_leaks=0 host/status_led_host
      - name: USB reconnect status regression
        run: ASAN_OPTIONS=detect_leaks=0 host/reconnect_host
      - name: CAPT watchdog scheduling and deadline regression
        run: python tools/test_capt_scheduler.py
      - name: Repeated Windows-style HTTP chunks
        run: python tools/test_capt_windows_chunks.py
      - name: ESP HTTP policy and low-heap admission
        run: |
          make -C host airprint_esp_policy_host
          python tools/test_capt_esp_policy.py
      - name: HP P1006 raster tests
        run: |
          ASAN_OPTIONS=detect_leaks=0 host/hp_host
          make -C host hp_p1006_profile_host hp_expand_host
          ASAN_OPTIONS=detect_leaks=0 host/hp_p1006_profile_host
          ASAN_OPTIONS=detect_leaks=0 host/hp_expand_host
          ASAN_OPTIONS=detect_leaks=0 python tools/test_hp_ipp_reservations.py
      - name: HP P1008 raster tests
        run: ASAN_OPTIONS=detect_leaks=0 host/hp_p1008_host
      - name: Standard printer streams and memory stress
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ghostscript python3-pil
          python -m pip install Pillow
          ASAN_OPTIONS=detect_leaks=0 python tools/test_standard_streams.py
          ASAN_OPTIONS=detect_leaks=0 host/memory_host > /tmp/memory-stress.log 2>&1 || { tail -60 /tmp/memory-stress.log; exit 1; }
          grep -E 'retained=|OOM' /tmp/memory-stress.log
      - name: Independent HP P1006 2-bit reference
        run: |
          git init /tmp/foo2xqx-reference
          git -C /tmp/foo2xqx-reference remote add origin https://github.com/OpenPrinting/foo2zjs.git
          git -C /tmp/foo2xqx-reference fetch --depth 1 origin 80499ed5bf6caa2963ad337e37cfda78a80aab1e
          git -C /tmp/foo2xqx-reference checkout --detach FETCH_HEAD
          cc -O2 -o /tmp/foo2xqx-reference/foo2xqx-ref /tmp/foo2xqx-reference/foo2xqx.c /tmp/foo2xqx-reference/jbig.c /tmp/foo2xqx-reference/jbig_ar.c
          ASAN_OPTIONS=detect_leaks=0 python tools/test_hp_reference.py /tmp/foo2xqx-reference/foo2xqx-ref
          ASAN_OPTIONS=detect_leaks=0 python tools/test_hp_reference.py /tmp/foo2xqx-reference/foo2xqx-ref host/hp_p1008_host --paper-count 3
      - name: Browser Wi-Fi protocol tests
        run: ASAN_OPTIONS=detect_leaks=0 host/improv_host
      - name: Quality settings HTTP route regression
        run: python tools/test_quality_route.py
      - name: IPP integration
        run: TEST_CAPT_PAGES=100 python tools/test_capt_ipp.py
      - name: Large IPP upload and disconnect simulation
        run: python tools/test_capt_ipp_transport.py
      - name: Small paper IPP integration
        run: python tools/test_small_papers.py
      - name: Web validation
        working-directory: web
        run: |
          npm run check
          node --test tests/*.test.ts
          node tests/diagnostics.mjs
          npm run build
      - name: Stage pinned Canon LBP6030 USB prerelease
        run: python tools/prepare_lbp6030_web.py
      - name: Stage pinned CAPT family USB prototypes
        run: python tools/prepare_capt_family_web.py
      - name: Build USB installer and offline Windows package
        run: |
          npm --prefix installer ci
          npm --prefix installer test
          npm --prefix installer run build
          mkdir -p release
          GOOS=windows GOARCH=amd64 go build -ldflags='-s -w' -o release/PrintServer-Offline.exe tools/offline/main.go
          cp "$(go env GOROOT)/LICENSE" release/LICENSE-Go.txt
          python tools/package_offline.py
          mkdir -p release/offline
          mv installer/dist/downloads/* release/offline/
          rmdir installer/dist/downloads
      - uses: actions/upload-artifact@v4
        with:
          name: esp32-hp-p1006-canon-lbp2900-profiles
          path: |
            firmware/
            release/offline/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: vietphuong-esp-web
          path: installer/dist/
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: installer/dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: true
    steps:
      - name: Check deployment revision
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          CURRENT_SHA=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          if [ "$CURRENT_SHA" = "$BUILD_COMMIT" ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Publish web installer
        if: steps.current.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

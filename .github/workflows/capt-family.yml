name: Experimental CAPT family firmware
on:
  push:
    branches: [feat/lbp6200]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protocol-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/test_capt_family.py
  firmware:
    strategy:
      fail-fast: false
      matrix:
        profile: [lbp6000, lbp6200, lbp3010]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: capt-family-${{ runner.os }}-${{ matrix.profile }}-${{ hashFiles('platformio.ini') }}
      - run: python -m pip install platformio==6.2.0 esptool==4.9.0
      - name: Compile dedicated model firmware
        run: pio run -e ${{ matrix.profile }}
      - name: Package exact binaries and source
        run: |
          python tools/package_firmware.py --env ${{ matrix.profile }} --out firmware/${{ matrix.profile }}
          mkdir -p package/${{ matrix.profile }}/tools
          cp tools/flash.py package/${{ matrix.profile }}/tools/flash.py
          cp -r firmware/${{ matrix.profile }} package/${{ matrix.profile }}/firmware
          cp docs/CAPT_FAMILY.md package/${{ matrix.profile }}/README-CAPT-FAMILY.md
          git rev-parse HEAD > package/${{ matrix.profile }}/BUILD_COMMIT.txt
          git archive --format=zip HEAD > package/${{ matrix.profile }}/source.zip
          cd package
          zip -qr ../${{ matrix.profile }}-USB-TEST.zip ${{ matrix.profile }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.profile }}-USB-TEST
          path: |
            ${{ matrix.profile }}-USB-TEST.zip
            .pio/build/${{ matrix.profile }}/firmware.elf
            .pio/build/${{ matrix.profile }}/firmware.map
          retention-days: 30

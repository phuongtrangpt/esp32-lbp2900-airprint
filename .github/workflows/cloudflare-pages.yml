name: Deploy vietphuong esp to Cloudflare Pages
on:
  workflow_run:
    workflows: [Build HP P1006 and Canon LBP2900 ESP 32]
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_COMMIT: ${{ github.event.workflow_run.head_sha }}
      BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - name: Check deployment revision
        id: current
        run: |
          CURRENT_SHA=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          if [ "$CURRENT_SHA" = "$BUILD_COMMIT" ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Cloudflare connection status
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'Cloudflare account is not connected. GitHub Pages remains available; see docs/CLOUDFLARE.md.'
          fi
      - uses: actions/setup-node@v4
        if: steps.current.outputs.publish == 'true' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        with:
          node-version: '24'
      - name: Download the checked web package
        if: steps.current.outputs.publish == 'true' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: gh run download "$BUILD_RUN_ID" --name vietphuong-esp-web --dir site
      - name: Publish the checked package
        if: steps.current.outputs.publish == 'true' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name vietphuong-esp --branch main

name: HP P1006 Android Print Connect
on:
  push:
    branches: [feat/hp-android]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build unchanged HP engine and actual ESP protocol with fake USB
        run: |
          mkdir -p /tmp/hp-pc-build /tmp/hp-android-test
          gcc -O2 -DPRINTSERVER_PROFILE_HP=1 -Icomponents/airprint/include -Icomponents/xqx/vendor desktop/hp-pc/worker/hp_render.c components/airprint/raster.c components/printers/hp_p1006.c components/xqx/vendor/jbig.c components/xqx/vendor/jbig_ar.c -lm -o /tmp/hp-pc-build/hp-render
          gcc -O1 -g -fsanitize=address,undefined -no-pie -Icomponents/hp_offload/include desktop/hp-pc/tests/bridge_host.c components/hp_offload/hp_offload.c -o /tmp/hp-pc-build/bridge-host
          gcc -O1 -g -fsanitize=address,undefined -no-pie -DPRINTSERVER_PROFILE_HP=1 -Icomponents/airprint/include -Icomponents/xqx/vendor -Iandroid/hp-p1006/app/src/main/cpp android/hp-p1006/tests/encoder_host.c android/hp-p1006/app/src/main/cpp/encoder.c components/printers/hp_p1006.c components/xqx/vendor/jbig.c components/xqx/vendor/jbig_ar.c -lm -o /tmp/hp-android-test/encoder-host
      - name: Cross-language transport and exact Windows renderer parity
        run: python android/hp-p1006/tests/test_transport.py -v
      - name: Preserve Windows final and stable printer drivers
        run: |
          git fetch origin e22657497671c2bf30f592c32b14f33ffe7ed834 --depth=1
          git diff --exit-code e22657497671c2bf30f592c32b14f33ffe7ed834 -- desktop/hp-pc components/printers components/capt components/xqx components/hp_offload src/usb_printer.c src/hp_pc_bridge.c src/hp_raw_bridge.c
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
      - name: Build installable development APK and instrumentation package
        working-directory: android/hp-p1006
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Print-Connect-Android-0.1.0
          path: |
            android/hp-p1006/app/build/outputs/apk/debug/app-debug.apk
            android/hp-p1006/README.md
            LICENSE
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: PDF to native HP output on real Android runtime
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          working-directory: android/hp-p1006
          script: gradle :app:connectedDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-test-reports
          path: android/hp-p1006/app/build/reports/androidTests/
  release:
    needs: [protocol, apk]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Print-Connect-Android-0.1.0
          path: checked-android
      - name: Publish separate Android test APK
        run: |
          mkdir release-android
          cp "$(find checked-android -name app-debug.apk -print -quit)" release-android/Viet-Phuong-Print-Connect-Android-0.1.0.apk
          cp android/hp-p1006/README.md release-android/INSTALLATION.md
          sha256sum release-android/*.apk > release-android/SHA256SUMS.txt
          TAG=print-connect-android-v0.1.0
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'Immutable version already exists; increment Android version before publishing.'
            exit 1
          fi
          gh release create "$TAG" release-android/* --prerelease --target "$GITHUB_SHA" --title 'Print Connect Android 0.1.0 · HP P1006' --notes-file android/hp-p1006/README.md

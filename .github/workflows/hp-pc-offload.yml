name: Viet Phuong Print Connect build
on:
  push:
    branches: [feat/hp-pc-offload, perf/hp-pc-startup]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build unchanged raster / HP engine on PC
        run: |
          mkdir -p /tmp/hp-pc-build
          gcc -O2 -g -DPRINTSERVER_PROFILE_HP=1 -Icomponents/airprint/include -Icomponents/airprint -Icomponents/xqx/vendor desktop/hp-pc/worker/hp_render.c components/airprint/raster.c components/printers/hp_p1006.c components/xqx/vendor/jbig.c components/xqx/vendor/jbig_ar.c -lm -o /tmp/hp-pc-build/hp-render
          gcc -O1 -g -fsanitize=address,undefined -no-pie -Icomponents/hp_offload/include desktop/hp-pc/tests/bridge_host.c components/hp_offload/hp_offload.c -o /tmp/hp-pc-build/bridge-host
      - name: Actual native transport and IPP tests
        run: |
          python desktop/hp-pc/tests/test_offload.py -v
          python desktop/hp-pc/tests/test_device_status.py -v
          python desktop/hp-pc/tests/test_usb_wait.py -v
      - name: Bound ESP address UI regression
        run: node --test desktop/hp-pc/tests/ui_state.test.cjs
      - name: Stable driver guards
        run: |
          git fetch origin c0d059e29deb78801001798e34f9d0151a77ccdc --depth=1
          git diff --exit-code c0d059e29deb78801001798e34f9d0151a77ccdc -- components/printers/hp_p1006.c components/printers/canon_lbp2900.c components/capt components/airprint/raster.c src/hp_raw_bridge.c installer
          python tools/test_hp_pc_usb_scope.py
  firmware:
    if: github.ref_name != 'perf/hp-pc-startup'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
      - run: python -m pip install platformio==6.2.0 esptool==4.9.0
      - run: |
          pio run -e hp_pc
          python tools/package_firmware.py --env hp_pc --out firmware/hp_pc
      - uses: actions/upload-artifact@v4
        with:
          name: Print-Connect-Firmware
          path: firmware/hp_pc/
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc
      - name: Build native Windows HP converter
        shell: msys2 {0}
        run: |
          mkdir -p desktop/hp-pc/build
          gcc -O2 -static -municode -DPRINTSERVER_PROFILE_HP=1 -Icomponents/airprint/include -Icomponents/airprint -Icomponents/xqx/vendor desktop/hp-pc/worker/hp_render.c components/airprint/raster.c components/printers/hp_p1006.c components/xqx/vendor/jbig.c components/xqx/vendor/jbig_ar.c -lm -lwinpthread -o desktop/hp-pc/build/hp-render.exe
      - name: Converter and IPP tests on Windows
        shell: pwsh
        run: |
          $env:HP_PC_BUILD = (Resolve-Path desktop/hp-pc/build).Path
          python desktop/hp-pc/tests/test_offload.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python desktop/hp-pc/tests/test_device_status.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python desktop/hp-pc/tests/test_usb_wait.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compare Windows document receive and handoff against USBWAIT baseline
        shell: pwsh
        run: |
          python desktop/hp-pc/tests/bench_receive.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git fetch origin 377f4c64fb0f0e52507291b447fb1ec6ce734911 --depth=1
          $baseline = Join-Path $env:RUNNER_TEMP 'hp-pc-receive-baseline'
          git worktree add --detach $baseline 377f4c64fb0f0e52507291b447fb1ec6ce734911
          python desktop/hp-pc/tests/bench_receive.py $baseline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows printer queue capability and integration
        run: python desktop/hp-pc/tests/windows_queue_smoke.py desktop/hp-pc/build/hp-render.exe
      - name: Package standalone worker
        shell: pwsh
        run: |
          python -m pip install pyinstaller==6.16.0
          python -m PyInstaller --noconfirm --clean --onedir --console --name hp-pc-worker --distpath desktop/hp-pc/worker-dist --workpath desktop/hp-pc/build/pyinstaller --specpath desktop/hp-pc/build --add-binary "${{ github.workspace }}/desktop/hp-pc/build/hp-render.exe;." desktop/hp-pc/worker/worker.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force desktop/hp-pc/src-tauri/resources/helper | Out-Null
          Copy-Item desktop/hp-pc/worker-dist/hp-pc-worker/* desktop/hp-pc/src-tauri/resources/helper -Recurse -Force
      - name: Standalone packaged worker end-to-end simulation
        run: python desktop/hp-pc/tests/smoke_bundle.py desktop/hp-pc/src-tauri/resources/helper/hp-pc-worker.exe
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop/hp-pc/src-tauri
            desktop/hp-pc/service-host
          cache-on-failure: true
      - name: Build native Windows Service
        shell: pwsh
        run: |
          cargo build --release --manifest-path desktop/hp-pc/service-host/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path desktop/hp-pc/service-host/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force desktop/hp-pc/src-tauri/resources/service | Out-Null
          Copy-Item desktop/hp-pc/service-host/target/release/hp-pc-service.exe desktop/hp-pc/src-tauri/resources/service/
      - name: Build Tauri Windows installer
        working-directory: desktop/hp-pc
        run: |
          python make_icon.py
          npm install --global @tauri-apps/cli@2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          tauri build --bundles nsis
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Installed Windows Service and manager lifecycle
        shell: pwsh
        run: |
          $installer = Get-ChildItem desktop/hp-pc/src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          python desktop/hp-pc/tests/service_smoke.py $installer.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Print-Connect-Windows
          path: |
            desktop/hp-pc/src-tauri/target/release/bundle/nsis/*-setup.exe
            desktop/hp-pc/README.md
            LICENSE
            desktop/hp-pc/src-tauri/Cargo.lock
            desktop/hp-pc/service-host/Cargo.lock

  release:
    if: github.ref_name == 'feat/hp-pc-offload'
    needs: [native, windows, firmware]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Print-Connect-Windows
          path: checked-windows
      - uses: actions/download-artifact@v4
        with:
          name: Print-Connect-Firmware
          path: checked-firmware
      - name: Package verified release
        run: python tools/package_print_connect_release.py --windows checked-windows --firmware checked-firmware --out public-release
      - name: Publish immutable product release
        run: |
          TAG=$(python -c "import json;print(json.load(open('public-release/release.json'))['tag'])")
          if gh release view "$TAG" >/dev/null 2>&1; then
            mkdir previous-release
            gh release download "$TAG" --pattern release.json --dir previous-release
            cmp public-release/release.json previous-release/release.json
          else
            gh release create "$TAG" public-release/* --target "$GITHUB_SHA" --title 'Viet Phuong Print Connect 1.0.0' --notes-file desktop/hp-pc/README.md
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Print-Connect-Release
          path: public-release/

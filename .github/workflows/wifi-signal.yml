name: Wi-Fi signal firmware verification
on:
  push:
    branches: [feat/wifi-signal]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        profile: [hp, canon]
    env:
      FIRMWARE_UPDATE_BASE_URL: ${{ vars.FIRMWARE_UPDATE_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
      - name: Verify stable print implementations unchanged
        run: git diff --exit-code cb84be1ca2b5993136001558cdfb0d9d0285345b -- components/printers components/capt components/xqx components/airprint src/usb_printer.c src/hp_raw_bridge.c src/hp_firmware.c src/print_job.c
      - name: Check Wi-Fi display and device page regressions
        run: |
          node tools/test_device_pages.mjs
          python tools/test_wifi_signal.py
      - name: Build and package model firmware
        run: |
          python -m pip install platformio==6.2.0 esptool==4.9.0
          pio run -e ${{ matrix.profile }}
          python tools/package_firmware.py --env ${{ matrix.profile }} --out firmware/${{ matrix.profile }}
      - name: Validate web UI
        run: |
          npm --prefix web run check
          npm --prefix web test
      - uses: actions/upload-artifact@v4
        with:
          name: WIFI-SIGNAL-${{ matrix.profile }}
          path: firmware/${{ matrix.profile }}/

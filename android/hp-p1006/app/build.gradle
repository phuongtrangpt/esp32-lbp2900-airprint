plugins { id 'com.android.application' }
android {
    namespace 'vn.io.vietphuong.printconnect'
    compileSdk 35
    ndkVersion '27.0.12077973'
    defaultConfig {
        applicationId 'vn.io.vietphuong.printconnect'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.1.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
        externalNativeBuild { cmake { arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'; cFlags '-O2' } }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
    testOptions { animationsDisabled true }
}

dependencies { androidTestImplementation 'androidx.test:runner:1.6.2'; androidTestImplementation 'androidx.test.ext:junit:1.2.1' }

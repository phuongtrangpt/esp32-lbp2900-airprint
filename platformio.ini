; a bare `pio run` (-t upload, -t ota) is the board only: without this it
; goes through every env, and the qemu image is flashed last, over the firmware
[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = espidf
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
; ESP32-S3-N16R8: quad SPI flash
board_build.flash_mode = qio
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; generates src/local_config.h from .env.example + .env, and the web UI
; (web/ -> components/webui/web_assets.c)
extra_scripts = pre:tools/gen_local_config.py, pre:tools/gen_web.py, post:tools/ota_target.py

; Same firmware with a self-test app_main for Espressif QEMU (see tools/qemu_selftest.sh)
[env:qemu]
extends = env:esp32s3
build_flags = -DPRINTSERVER_QEMU_SELFTEST
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.qemu

[env:hp]
extends = env:esp32s3
custom_printer_profile = hp
board_build.cmake_extra_args = -DPRINTSERVER_PROFILE=hp -DPRINTSERVER_HP_RAW_BRIDGE=ON

[env:hp_p1008]
extends = env:esp32s3
custom_printer_profile = hp_p1008
board_build.cmake_extra_args = -DPRINTSERVER_PROFILE=hp_p1008

[env:canon]
extends = env:esp32s3
custom_printer_profile = canon
board_build.cmake_extra_args = -DPRINTSERVER_PROFILE=canon

[env:pixma]
extends = env:esp32s3
custom_printer_profile = pixma
board_build.cmake_extra_args = -DPRINTSERVER_PROFILE=pixma

[env:standard]
extends = env:esp32s3
custom_printer_profile = standard
board_build.cmake_extra_args = -DPRINTSERVER_PROFILE=standard

[env:lbp6000]
extends = env:esp32s3
custom_printer_profile = lbp6000
board_build.cmake_extra_args = -DPRINTSERVER_PROFILE=lbp6000

[env:lbp6200]
extends = env:esp32s3
custom_printer_profile = lbp6200
board_build.cmake_extra_args = -DPRINTSERVER_PROFILE=lbp6200

[env:lbp3010]
extends = env:esp32s3
custom_printer_profile = lbp3010
board_build.cmake_extra_args = -DPRINTSERVER_PROFILE=lbp3010
